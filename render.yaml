services:
  - type: web
    name: stemai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DEMUCS_MODEL
        value: htdemucs
      - key: DEMUCS_DEVICE
        value: auto
      - key: DEMUCS_CPU_THREADS
        value: "4"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: FIREBASE_STORAGE_BUCKET
        value: vocal-separater-5eb7c.firebasestorage.app
      - key: FIREBASE_PROJECT_ID
        value: vocal-separater-5eb7c
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        value: https://stem-ai-audio-separator.vercel.app,http://localhost:5173,http://127.0.0.1:5173

