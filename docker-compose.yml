version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - FIREBASE_PROJECT_ID=vocal-separater-5eb7c
      - FIREBASE_STORAGE_BUCKET=vocal-separater-5eb7c.firebasestorage.app
      - DEMUCS_MODEL=htdemucs
      - DEMUCS_DEVICE=auto
      - DEMUCS_CPU_THREADS=4
      - MAX_CONCURRENT_JOBS=1
    volumes:
      - ./backend:/app
      - /tmp/stemai_processing:/tmp/stemai_processing
